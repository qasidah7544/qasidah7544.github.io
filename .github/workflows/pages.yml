name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A63F2F: ${{ secrets.A63F2F }}
          BAD5E7: ${{ secrets.BAD5E7 }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('A63F2F', '')
          env_b = os.environ.get('BAD5E7', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- 355acfe527d73f97e3de7c12b73e6b800c912572cfbf4103 -->', env_a)
          if env_b:
              result = result.replace('<!-- f380595d2f757bd3401bd616c474c1ddc92167 -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
